# Checagens rápidas em PR e na main. Build e publicação ficam na EAS.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gera .expo/types, para o tsc checar as rotas tipadas.
      - run: npx expo customize tsconfig.json
        env:
          CI: 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  # Regras do Firestore e do Storage contra os emuladores, que precisam de Java.
  # O emulador do Storage baixa o motor de regras dele na primeira execução.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  # Cloud Functions (functions/): tipos, testes unitários e as funções de ponta
  # a ponta nos emuladores de Auth, Firestore, Functions e Storage.
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix functions
      - run: npm --prefix functions run typecheck
      - run: npm --prefix functions test
      - run: npm run test:functions
